<!DOCTYPE html><html lang="ar"><head>  <meta charset="UTF-8">  <title>Shehaby Shooting Pro</title>  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">  <link rel="stylesheet" href="style.css"></head>
<body>
<h1>Shehaby Shooting Pro</h1>
<!-- تحميل الهدف --><input type="file" id="targetInput" accept="image/*">
<!-- الهدف --><div id="targetContainer">  <img id="targetImg" /></div>
<!-- أدوات --><div class="controls">  <button id="analyzeBtn">بدء تحليل الأخطاء</button></div>
<!-- النتيجة --><div id="result"></div>
<hr>
<!-- ====== التفعيل ====== --><div id="licenseBox">  <h3>النسخة الاحترافية</h3>
  <div id="freeNotice">    <p>أنت تستخدم النسخة المجانية (10 طلقات فقط)</p>  </div>
  <div id="proNotice" style="display:none;">    <p> النسخة الاحترافية مفعلة</p>  </div>
  <input    type="text"    id="licenseInput"    placeholder="أدخل كود التفعيل"  >
  <button onclick="activateLicense()">تفعيل النسخة الاحترافية</button></div>
<script src="license.js"></script><script src="app.js"></script>
<script>  // ربط الواجهة مع نظام التفعيل  function activateLicense() {    const key = document.getElementById("licenseInput").value.trim();    if (activatePro(key)) {      updateLicenseUI();    }  }
  function updateLicenseUI() {    if (isProUser()) {      document.getElementById("freeNotice").style.display = "none";      document.getElementById("proNotice").style.display = "block";      document.getElementById("licenseInput").style.display = "none";    }  }
  updateLicenseUI();</script>
</body></html>
