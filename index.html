<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shooting Pro</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1 id="appTitle">تحليل أخطاء الرماية</h1>

  <button id="langToggle">EN</button>
</header>

<main>

  <section id="targetSection">
    <img id="targetImage" src="target.png" alt="Target">
    <canvas id="overlay"></canvas>
  </section>

  <section id="controls">
    <button id="setCenterBtn">تحديد مركز الهدف</button>
    <button id="shotBtn">توقيع طلقة</button>
    <button id="resetBtn">إعادة تعيين</button>
  </section>

  <section id="analysis">
    <h2 id="analysisTitle">تحليل الطلقة</h2>
    <div id="analysisResult"></div>
  </section>

  <section id="proSection">
    <h3>النسخة الاحترافية</h3>
    <button id="activateProBtn">تفعيل النسخة الاحترافية</button>
    <div id="proStatus"></div>
  </section>

</main>

<script src="license.js"></script>
<script src="app.js"></script>

</body>
</html>
