<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>Shooting Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Shooting Pro</h1>
  <button id="langToggle">EN</button>
  <button id="proBtn">PRO</button>
</header>

<main>

  <section id="targetSection">
    <input type="file" id="targetUpload" accept="image/*">
    <canvas id="targetCanvas"></canvas>
  </section>

  <section id="controls">
    <button id="setCenterBtn">تحديد مركز الهدف</button>
    <button id="shotBtn">توقيع الطلقات</button>
    <button id="analyzeBtn">بدء تحليل الأخطاء</button>
  </section>

  <section id="results"></section>

  <!-- Pro Modal -->
  <div id="proModal" class="modal hidden">
    <div class="modal-content">
      <h2>تفعيل النسخة الاحترافية</h2>
      <p>حوّل على المحفظة 01067050007 ثم أدخل كود التفعيل</p>
      <input type="text" id="proCode" placeholder="كود التفعيل">
      <div class="modal-actions">
        <button id="activateBtn">تفعيل</button>
        <button id="cancelProBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Pro Only -->
  <section id="postureSection" class="hidden">
    <h2>تحليل وقفة الرامي</h2>
    <input type="file" id="shooterUpload" accept="image/*">
    <div id="postureResult"></div>
  </section>

</main>

<script src="lang.js"></script>
<script src="app.js"></script>
<script src="license.js"></script>

</body>
</html>
